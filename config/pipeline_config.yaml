# ==============================================================================
# PIPELINE CONFIGURATION: ADMISSION BIG DATA FRAMEWORK
# ==============================================================================
version: "3.0"
environment: "experimentation"
data_kind: "real"

# 1. Lựa chọn Nền tảng Tính toán (Compute Backend)
# Các backend đã triển khai: local_pandas, apache_spark.
execution_backend: "apache_spark"

spark:
  app_name: "admission-big-data"
  master: "local[2]"
  conf:
    spark.sql.shuffle.partitions: "4"
    spark.sql.parquet.compression.codec: "snappy"

feature_options:
  min_training_year: 2018

# Đợt 20-2 có 10.857 dòng trùng hoàn toàn với đợt 20 trong nguồn CT2006.
cdf_options:
  excluded_year_labels:
    score_distribution_ct2006: ["20-2"]

model_training:
  min_train_years: 2
  max_gold_rows: 1000000

# 2. Cấu hình Cắm Rút Công Nghệ Tùy Biến (Custom User Technology Plugins)
# Người dùng có thể chọn:
# - Option A (Mặc định): type: "builtin"
# - Option B (Class Adapter): type: "class_adapter", target: "plugins.custom_cdf_adapter.CustomUserCDFAdapter"
# - Option C (Script Zero-Syntax): type: "external_script", command: ".venv\\Scripts\\python.exe plugins/custom_script_cdf.py --input {input_uri} --output {output_uri}"
backend_execution:
  cdf_stage:
    type: "builtin"

# 3. Quản lý Chế độ Nạp Dữ liệu (Ingestion Strategy)
data_ingestion:
  # Chế độ: "direct_data" (nạp thẳng file) hoặc "fetch_script" (chạy script cào)
  mode: "direct_data"

  # Nguồn dữ liệu trực tiếp
  direct_sources:
    cutoff_scores: "data/data-cleaned/v3/prepared/cutoff-scores.parquet"
    majors: "data/data-cleaned/v3/prepared/majors.parquet"
    score_blocks: "data/data-cleaned/admission-cutoff-score/score-blocks.parquet"
    score_distribution_ct2006: "data/data-raw/score-distribution/score-distribution-2016-2025-ct2006.parquet"
    score_distribution_ct2018: "data/data-raw/score-distribution/score-distribution-2025-ct2018.parquet"
    trend_annual: "data/data-cleaned/google-trends/trend_annual.parquet"
    trend_keywords: "data/data-cleaned/google-trends/trend_keywords.parquet"

  # Nguồn kịch bản fetch dữ liệu (khi mode: fetch_script)
  fetch_scripts:
    trends_crawler:
      entrypoint: "scripts-fetching/unit-scripts/get_trends.py"
      enabled: false

# 4. Đường dẫn lưu trữ kết quả qua các tầng (Lakehouse Paths)
data_paths:
  cdf_output: "data/data-cleaned/v3/cdf_deduplicated.parquet"
  features_output: "data/data-cleaned/v3/gold_deduplicated.parquet"
  models_dir: "models/"
  report_output: "reports/evaluation_temporal.md"

# 5. Cổng Kiểm Định Chất Lượng & Sàn Sai Số Bayes (Quality Gate)
quality_gate:
  max_rmse: 0.160
  min_r2: 0.78
  max_bayes_gap_mse: null

# 6. Cơ chế Vận hành Tin Cậy (Retry - Fallback - Rollback)
reliability:
  retry_policy:
    max_attempts: 3
    initial_backoff_sec: 2
    backoff_multiplier: 2.0

