# Cấu hình các địa chỉ dùng trong dự án

# Tệp cấu hình tham số
configs:
  keywords: "config/keywords_it.yaml"
  scraper_config: "config/scraper_config.yaml"

# Dữ liệu thô (Raw Data)
raw_data:
  cutoff_scores: "data-raw/admission-cutoff-score/cutoff-scores.parquet"
  majors: "data-raw/admission-cutoff-score/majors.parquet"
  score_blocks: "data-raw/admission-cutoff-score/score-blocks.parquet"
  trend_topics: "data-raw/google-trends/trend_topics.parquet"
  trends: "data-raw/google-trends/trends.json"
  trends_cache: "data-raw/google-trends/trends-cache.sqlite3"
  score_distribution_ct2006: "data-raw/score-distribution/score-distribution-2016-2025-ct2006.parquet"
  score_distribution_ct2018: "data-raw/score-distribution/score-distribution-2025-ct2018.parquet"

# Dữ liệu đã làm sạch / chuẩn hóa (Cleaned Data)
cleaned_data:
  cutoff_scores: "data-cleaned/admission-cutoff-score/cutoff-scores.parquet"
  majors: "data-cleaned/admission-cutoff-score/majors.parquet"
  score_blocks: "data-cleaned/admission-cutoff-score/score-blocks.parquet"
  trend_topics: "data-cleaned/google-trends/trend_topics.parquet"
  trend_queries: "data-cleaned/google-trends/trend_queries.parquet"
  trend_keywords: "data-cleaned/google-trends/trend_keywords.parquet"
  trend_timeline: "data-cleaned/google-trends/trend_timeline.parquet"
  trend_annual: "data-cleaned/google-trends/trend_annual.parquet"
  trend_regions: "data-cleaned/google-trends/trend_regions.parquet"
  trend_related_queries: "data-cleaned/google-trends/trend_related_queries.parquet"

# Script công cụ hỗ trợ
supporting_scripts:
  convert_notebook_2_unit_script: "helpers/convert_notebook_2_unit_script.py"
  crawl_trend_data: "helpers/crawl_trend_data.py"

# Log chạy pipeline
logs:
  google_trends: "logs/google-trends.log"

# Unit Script xử lý dữ liệu (Processing Unit Scripts)
unit_scripts:
  cutoff_scores: "scripts-processing/unit-scripts/cutoff_scores.py"
  majors: "scripts-processing/unit-scripts/majors.py"
  score_blocks: "scripts-processing/unit-scripts/score_blocks.py"
  clean_trends: "scripts-processing/unit-scripts/clean_trends.py"
  get_topics: "scripts-fetching/unit-scripts/get_topics.py"
  get_trends: "scripts-fetching/unit-scripts/get_trends.py"
