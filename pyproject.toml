[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "admission-core"
version = "2.1.0"
description = "Dynamic Percentile-Equilibrated University Admission Framework"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0"
]

[project.scripts]
admission-cli = "admission_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

