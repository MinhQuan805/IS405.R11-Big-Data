[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "admission-core"
version = "3.0.0"
description = "Dynamic Percentile-Equilibrated University Admission Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.2.3,<3",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "scipy>=1.11",
    "joblib>=1.3"
]

[project.optional-dependencies]
spark = ["pyspark==4.3.0"]
dev = ["pytest>=8", "psutil>=5.9", "duckdb>=1.0"]

[project.scripts]
admission-cli = "admission_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = ["spark: requires a working Spark and Java runtime"]

